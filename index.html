<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>澳門綜合能力評估開考 精選100題操題</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px; background: #f4f4f7; color: #1d1d1f; line-height: 1.55; }
  .container { max-width: 820px; margin: 0 auto; }
  h1 { text-align: center; color: #0071e3; font-size: 1.45rem; margin-bottom: 8px; }
  .sub { text-align: center; color: #555; font-size: 0.9rem; margin-bottom: 16px; }
  .intro { background: #fff; padding: 14px; border-radius: 12px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); font-size: 0.95rem; }
  .categories { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .cat-btn { background: #fff; border: 2px solid #0071e3; color: #0071e3; padding: 12px 8px; border-radius: 10px; font-size: 0.95rem; cursor: pointer; text-align: center; }
  .cat-btn.active, .cat-btn:hover { background: #0071e3; color: #fff; }
  .quiz-area { background: #fff; padding: 18px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); min-height: 280px; }
  .question { font-size: 1.05rem; font-weight: 500; margin-bottom: 14px; }
  .options { display: flex; flex-direction: column; gap: 9px; }
  .option { background: #f5f5f7; border: 1px solid #d1d1d6; padding: 11px 14px; border-radius: 8px; cursor: pointer; }
  .option:hover { background: #e8e8ed; }
  .option.selected { border-color: #0071e3; background: #e8f2ff; }
  .option.correct { background: #d4edda; border-color: #28a745; }
  .option.wrong { background: #f8d7da; border-color: #dc3545; }
  .explanation { margin-top: 14px; padding: 12px; background: #fff8e1; border-left: 4px solid #ffc107; border-radius: 4px; display: none; font-size: 0.95rem; }
  .controls { margin-top: 18px; display: flex; justify-content: space-between; align-items: center; }
  .btn { background: #0071e3; color: #fff; border: none; padding: 11px 22px; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  .btn:disabled { background: #ccc; }
  .btn-sec { background: #6c757d; }
  .progress, .score { text-align: center; }
  .progress { color: #666; margin-bottom: 10px; }
  .score { font-size: 1.25rem; margin: 16px 0; }
  .hidden { display: none; }
  .bank-section { background: #fff; padding: 16px; border-radius: 12px; margin-top: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .bank-item { margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid #eee; }
  .bank-item:last-child { border-bottom: none; }
  .bank-q { font-weight: 500; margin-bottom: 6px; }
  .bank-opt { margin: 3px 0; padding-left: 8px; }
  .bank-ans { color: #28a745; font-weight: 500; margin-top: 4px; }
  .bank-exp { color: #555; font-size: 0.92rem; margin-top: 4px; }
  .toggle-bank { margin: 12px 0; text-align: center; }
</style>
</head>
<body>
<div class="container">
  <h1>澳門綜合能力評估開考<br>精選100題高概率操題</h1>
  <div class="sub">閉卷選擇題練習 · 選最佳答案 · 官方風格參考</div>
  <div class="intro">
    <strong>說明：</strong>根據官方試題範例、法例選擇題PDF及常見考點精選約100題。重點覆蓋基本法、憲法、工作人員通則（年假／遲到）、行政程序、職程制度、邏輯序列、圖表計算等。正式考試以最新官方公告為準。
  </div>

  <div class="categories" id="categories">
    <button class="cat-btn" data-cat="all">全部混合 (~100)</button>
    <button class="cat-btn" data-cat="law">法例 (~60)</button>
    <button class="cat-btn" data-cat="logic">邏輯 (~20)</button>
    <button class="cat-btn" data-cat="chart">圖表數據 (~10)</button>
    <button class="cat-btn" data-cat="lang">語文理解 (~10)</button>
  </div>

  <div class="quiz-area" id="quizArea">
    <div id="startScreen"><p style="text-align:center; font-size:1.05rem;">請選擇上方類別開始練習</p></div>
    <div id="quizContent" class="hidden">
      <div class="progress" id="progress"></div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="explanation" id="explanation"></div>
      <div class="controls">
        <button class="btn btn-sec" id="prevBtn" disabled>上一題</button>
        <span id="qNum"></span>
        <button class="btn" id="nextBtn">下一題</button>
      </div>
    </div>
    <div id="resultScreen" class="hidden">
      <div class="score" id="finalScore"></div>
      <p style="text-align:center;" id="resultMsg"></p>
      <div style="text-align:center; margin-top:18px;">
        <button class="btn" id="restartBtn">再練一次</button>
      </div>
    </div>
  </div>
  <div class="toggle-bank">
    <button class="btn btn-sec" id="toggleBankBtn">顯示全部題庫（可閱讀／溫習）</button>
  </div>
  <div class="bank-section hidden" id="bankSection"></div>
</div>

<script>
const questions = {
  law: [
    {q: "《中華人民共和國澳門特別行政區基本法》何時起實施？", options: ["1999年12月19日", "1999年12月25日", "1999年12月20日", "1999年10月1日"], answer: 2, exp: "1993年3月31日全國人民代表大會通過決定，基本法自1999年12月20日起實施。"},
    {q: "根據《澳門特別行政區基本法》，澳門特別行政區實施下列哪個方針？", options: ["一個國家，一種制度", "一個地區，兩種制度", "一個國家，兩種制度", "以上皆不是"], answer: 2, exp: "一國兩制是基本方針。"},
    {q: "根據《基本法》，澳門特別行政區是中華人民共和國的：", options: ["可全部分離的部分", "可部分分離的部分", "可逐步分離的部分", "不可分離的部分"], answer: 3, exp: "澳門是中華人民共和國不可分離的部分。"},
    {q: "根據《基本法》，授權澳門特別行政區依法實行高度自治的是：", options: ["中央人民政府", "全國人民代表大會", "最高人民法院", "國務院"], answer: 1, exp: "全國人民代表大會授權澳門特區實行高度自治。"},
    {q: "根據《基本法》，澳門特別行政區享有：", options: ["行政管理權", "立法權", "獨立的司法權和終審權", "以上皆是"], answer: 3, exp: "澳門特區享有行政管理權、立法權、獨立的司法權和終審權。"},
    {q: "根據《基本法》，澳門特別行政區維持原有的資本主義制度和生活方式不變，為期：", options: ["20年", "30年", "40年", "50年"], answer: 3, exp: "50年不變。"},
    {q: "根據《基本法》，澳門特別行政區的正式語文是：", options: ["只有中文", "只有葡文", "中文和葡文", "中文、葡文和英文"], answer: 2, exp: "中文和葡文都是正式語文。"},
    {q: "中華人民共和國現行憲法於哪一年通過？", options: ["1954年", "1975年", "1978年", "1982年"], answer: 3, exp: "現行憲法是1982年通過的。"},
    {q: "第2/2009號法律是哪一部法律？", options: ["政府組織綱要法", "維護國家安全法", "公務人員職程制度", "公共部門勞動合同制度"], answer: 1, exp: "第2/2009號法律是《維護國家安全法》。"},
    {q: "根據現行《澳門公共行政工作人員通則》，每日或每周遲到超過多少分鐘，須作不合理缺勤紀錄？", options: ["每日十五分鐘或每周三十分鐘", "每日二十分鐘或每周四十分鐘", "每日三十分鐘或每周六十分鐘", "以上皆是"], answer: 0, exp: "每日遲到超過十五分鐘或每周超過三十分鐘須作不合理缺勤紀錄（經書面解釋且上級接納者除外）。"},
    {q: "根據現行《澳門公共行政工作人員通則》，除法律另有規定外，年假權屬不可放棄之權利，而年假權之實際享受：", options: ["不得以任何金錢補償代替", "得以相應日數之報酬補償代替", "得以雙倍之報酬補償代替", "得以其他津貼補償代替"], answer: 0, exp: "年假權不可放棄，且不得以金錢補償代替。"},
    {q: "根據現行《澳門公共行政工作人員通則》，工作人員每一曆年有權享受年假多少個工作日？", options: ["11個", "15個", "22個", "30個"], answer: 2, exp: "提供無中斷實際服務逾一年的工作人員，每一曆年有權享受年假二十二個工作日。"},
    {q: "根據現行《澳門公共行政工作人員通則》，每一曆年工作人員最少須享受多少個工作日的年假？", options: ["7個", "10個", "11個", "15個"], answer: 2, exp: "每一曆年最少享受十一個工作日的年假，其中一段不得少於十個工作日。"},
    {q: "根據現行《澳門公共行政工作人員通則》，基於適當理由並經部門領導批准，可將已到期及累積的最多多少個工作日的年假轉移至下一曆年？", options: ["11個", "15個", "22個", "30個"], answer: 2, exp: "最多可轉移二十二個工作日的年假。"},
    {q: "根據現行《澳門公共行政工作人員通則》，特別工作時間制度包括：", options: ["彈性工作時間", "輪值工作", "特定工作時間", "以上皆是"], answer: 3, exp: "特別工作時間制度包括彈性工作時間、輪值工作及特定工作時間。"},
    {q: "根據現行《澳門公共行政工作人員通則》，一般工作時間制度下，每周正常工作時數通常為：", options: ["30小時", "35小時", "36小時", "40小時"], answer: 2, exp: "一般制度每周正常工作時數為三十六小時（警務等特別情況除外）。"},
    {q: "《行政程序法典》（第57/99/M號法令）引入的重要原則之一是：", options: ["善意原則", "絕對權力原則", "任意原則", "以上皆是"], answer: 0, exp: "確立了公共行政當局應遵循的善意原則。"},
    {q: "第14/2009號法律是哪一部法律？", options: ["維護國家安全法", "公務人員職程制度", "公共部門勞動合同制度", "政府組織綱要法"], answer: 1, exp: "第14/2009號法律是《公務人員職程制度》。"},
    {q: "第12/2015號法律是哪一部法律？", options: ["公務人員職程制度", "公共部門勞動合同制度", "工作表現評核一般制度", "政府組織綱要法"], answer: 1, exp: "第12/2015號法律是《公共部門勞動合同制度》。"},
    {q: "第31/2004號行政法規是關於：", options: ["政府組織", "公務人員職程", "公共行政工作人員的工作表現評核一般制度", "行政程序"], answer: 2, exp: "第31/2004號行政法規是《公共行政工作人員的工作表現評核一般制度》。"},
    {q: "根據《基本法》，澳門特別行政區的行政機關由下列哪類人士組成？", options: ["任何人士", "非永久性居民", "永久性居民", "以上皆可"], answer: 2, exp: "行政機關由澳門特別行政區永久性居民組成。"},
    {q: "根據《基本法》，澳門特別行政區居民包括：", options: ["只有永久性居民", "只有非永久性居民", "永久性居民和非永久性居民", "以上皆不是"], answer: 2, exp: "澳門居民包括永久性居民和非永久性居民。"},
    {q: "根據《基本法》，澳門永久性居民享有：", options: ["選舉權", "被選舉權", "選舉權和被選舉權", "以上皆不是"], answer: 2, exp: "永久性居民享有選舉權和被選舉權。"},
    {q: "根據《基本法》，中央人民政府負責管理與澳門特別行政區有關的：", options: ["立法事務", "外交事務", "司法事務", "以上皆是"], answer: 1, exp: "中央人民政府負責管理與澳門特區有關的外交事務。"},
    {q: "根據《基本法》，澳門特別行政區區旗的圖案包括：", options: ["五星和梅花", "五星、蓮花、大橋和海水", "只有蓮花和大橋", "五星和海水"], answer: 1, exp: "區旗以綠色為底，中間是五星、蓮花、大橋和海水的圖案。"},
    {q: "根據《基本法》，澳門特別行政區自行立法禁止的行為包括：", options: ["愛國行為", "叛國行為", "支持中央政府的行為", "以上皆是"], answer: 1, exp: "澳門特區應自行立法禁止叛國、分裂國家等危害國家安全的行為（見第23條）。"},
    {q: "根據現行《澳門公共行政工作人員通則》，工作人員因結婚而缺勤，應在缺勤開始前最少提早多少日以書面通知，並在結婚後多少日內出示證明？", options: ["十五日；三十日", "三十日；十五日", "七日；十五日", "十五日；十五日"], answer: 0, exp: "最少提早十五日書面通知，並在締結婚姻後三十日內出示證明。"},
    {q: "根據現行《澳門公共行政工作人員通則》，合理缺勤的原因包括：", options: ["結婚", "患病", "親屬死亡", "以上皆是"], answer: 3, exp: "結婚、成為父母、親屬死亡、患病、工傷、捐血等均屬合理缺勤（須符合法定條件）。"},
    {q: "根據《基本法》，澳門特別行政區的立法機關是：", options: ["行政長官", "立法會", "終審法院", "行政會"], answer: 1, exp: "立法會是澳門特別行政區的立法機關。"},
    {q: "根據《基本法》，澳門特別行政區的終審權屬於：", options: ["中級法院", "初級法院", "終審法院", "最高人民法院"], answer: 2, exp: "澳門特別行政區享有獨立的司法權和終審權，終審權屬於澳門特區終審法院。"},
    {q: "根據現行《澳門公共行政工作人員通則》，擔任公職的年齡上限一般為：", options: ["60歲", "65歲", "70歲", "無上限"], answer: 1, exp: "擔任公職的年齡上限為六十五歲。"},
    {q: "根據《基本法》，澳門特別行政區永久性居民是指：", options: ["在澳門通常居住連續七年以上的中國公民", "在澳門通常居住連續七年以上的人士（符合條件）", "任何在澳門出生的人士", "以上皆不是"], answer: 1, exp: "永久性居民包括在澳門通常居住連續七年以上的中國公民及其他符合條件的人士。"},
    {q: "根據現行《澳門公共行政工作人員通則》，工作人員每月已履行待命義務的日數由誰確認？", options: ["行政長官", "部門領導", "評核人", "同事"], answer: 1, exp: "由部門領導確認。"},
    {q: "根據《基本法》，澳門特別行政區的行政長官由：", options: ["中央人民政府任命", "立法會選舉產生", "居民直選", "以上皆是"], answer: 0, exp: "行政長官由一個具有廣泛代表性的選舉委員會選出，由中央人民政府任命。"},
    {q: "根據現行《澳門公共行政工作人員通則》，年假應在何時享受？", options: ["任何時間", "到期的曆年內", "下一曆年", "無規定"], answer: 1, exp: "除法律另有規定外，年假應在到期的曆年內享受。"},
    {q: "根據《行政程序法典》，行政程序是指：", options: ["行政行為本身", "行政合同", "為形成和表明公共行政當局意思或執行該意思而進行的有序行為及手續的連續", "以上皆是"], answer: 2, exp: "行政程序是為形成和表明公共行政當局的意思或執行該意思而進行的有序行為及手續的連續。"},
    {q: "根據現行《澳門公共行政工作人員通則》，工作時間制度可分為：", options: ["一般制度和特別制度", "只有一般制度", "只有特別制度", "無分類"], answer: 0, exp: "分為一般制度及特別制度。"},
    {q: "根據《基本法》，澳門特別行政區的財政收入全部：", options: ["上繳中央", "由澳門特區自行支配", "由立法會支配", "由行政長官個人支配"], answer: 1, exp: "澳門特別行政區的財政收入全部由澳門特別行政區自行支配，不上繳中央人民政府。"},
    {q: "根據現行《澳門公共行政工作人員通則》，停職處分的時效一般自裁定轉為不可上訴之日起計經多少年完成？", options: ["兩年", "三年", "四年", "五年"], answer: 1, exp: "除另有規定，停職處分之時效自裁定轉為不可上訴之日起計，經三年完成。"},
    {q: "根據《基本法》，澳門特別行政區的社會治安由：", options: ["中央人民政府負責", "澳門特別行政區政府負責", "立法會負責", "終審法院負責"], answer: 1, exp: "澳門特別行政區政府負責維持澳門特別行政區的社會治安。"},
    {q: "根據現行《澳門公共行政工作人員通則》，工作人員因患病缺勤，應在多長時間內以書面或口頭方式通知部門？", options: ["即時", "三個工作日內", "五個工作日內", "七個工作日內"], answer: 1, exp: "應在三個工作日內通知部門，並說明預計患病期及聯絡地點。"},
    {q: "根據《基本法》，澳門特別行政區的貨幣金融制度由：", options: ["中央人民政府制定", "澳門特別行政區自行制定", "立法會單獨制定", "以上皆不是"], answer: 1, exp: "澳門特別行政區自行制定貨幣金融政策，保障金融企業和金融市場的經營自由。"},

let currentQuestions = [];
let currentIndex = 0;
let userAnswers = [];
let score = 0;
let selectedCategory = '';

document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedCategory = btn.dataset.cat;
    startQuiz(selectedCategory);
  });
});

function startQuiz(cat) {
  currentQuestions = [];
  if (cat === 'all') {
    Object.values(questions).forEach(arr => currentQuestions.push(...arr));
  } else {
    currentQuestions = [...(questions[cat] || [])];
  }
  currentQuestions.sort(() => Math.random() - 0.5);
  currentIndex = 0;
  userAnswers = new Array(currentQuestions.length).fill(null);
  score = 0;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizContent').classList.remove('hidden');
  showQuestion();
}

function showQuestion() {
  const q = currentQuestions[currentIndex];
  document.getElementById('progress').textContent = `第 ${currentIndex + 1} / ${currentQuestions.length} 題`;
  document.getElementById('qNum').textContent = `${currentIndex + 1} / ${currentQuestions.length}`;
  document.getElementById('question').textContent = q.q;
  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.textContent = String.fromCharCode(65 + i) + '. ' + opt;
    if (userAnswers[currentIndex] !== null) {
      if (i === q.answer) div.classList.add('correct');
      if (i === userAnswers[currentIndex] && i !== q.answer) div.classList.add('wrong');
      if (i === userAnswers[currentIndex]) div.classList.add('selected');
    }
    div.addEventListener('click', () => selectOption(i));
    optionsDiv.appendChild(div);
  });
  const expDiv = document.getElementById('explanation');
  if (userAnswers[currentIndex] !== null) {
    expDiv.textContent = q.exp;
    expDiv.style.display = 'block';
  } else {
    expDiv.style.display = 'none';
  }
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').textContent = currentIndex === currentQuestions.length - 1 ? '查看結果' : '下一題';
}

function selectOption(idx) {
  if (userAnswers[currentIndex] !== null) return;
  userAnswers[currentIndex] = idx;
  const q = currentQuestions[currentIndex];
  if (idx === q.answer) score++;
  showQuestion();
}

document.getElementById('nextBtn').addEventListener('click', () => {
  if (currentIndex < currentQuestions.length - 1) {
    currentIndex++;
    showQuestion();
  } else {
    showResult();
  }
});

document.getElementById('prevBtn').addEventListener('click', () => {
  if (currentIndex > 0) {
    currentIndex--;
    showQuestion();
  }
});

document.getElementById('restartBtn').addEventListener('click', () => {
  if (selectedCategory) startQuiz(selectedCategory);
});

  const bank = document.getElementById('bankSection');
  if (bank.innerHTML) return; // already rendered
  let html = '<h2 style="text-align:center; color:#0071e3; margin-top:0;">完整題庫（含答案與解釋）</h2>';
  const catNames = { law: '法例', logic: '語理及數理邏輯', chart: '圖表數據分析', lang: '語文理解' };
  for (const [key, arr] of Object.entries(questions)) {
    html += `<h3 style="color:#0071e3; margin-top:20px;">${catNames[key] || key}（${arr.length}題）</h3>`;
    arr.forEach((item, idx) => {
      const letter = String.fromCharCode(65 + item.answer);
      html += `<div class="bank-item">
        <div class="bank-q">${idx + 1}. ${item.q}</div>
        ${item.options.map((o, i) => `<div class="bank-opt">${String.fromCharCode(65+i)}. ${o}</div>`).join('')}
        <div class="bank-ans">答案：${letter}</div>
        <div class="bank-exp">解釋：${item.exp}</div>
      </div>`;
    });
  }
  bank.innerHTML = html;
}

document.getElementById('toggleBankBtn').addEventListener('click', () => {
  const section = document.getElementById('bankSection');
  const btn = document.getElementById('toggleBankBtn');
  if (section.classList.contains('hidden')) {
    renderBank();
    section.classList.remove('hidden');
    btn.textContent = '隱藏題庫';
  } else {
    section.classList.add('hidden');
    btn.textContent = '顯示全部題庫（可閱讀／溫習）';
  }
});

function showResult() {
  document.getElementById('quizContent').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  const total = currentQuestions.length;
  const percent = Math.round((score / total) * 100);
  document.getElementById('finalScore').textContent = `得分：${score} / ${total} （${percent}%）`;
  let msg = percent >= 80 ? '表現優秀！繼續保持。' : percent >= 60 ? '不錯，再加強弱項。' : percent >= 50 ? '剛剛合格，建議多練錯題。' : '需要加強，尤其是法例重點數字同原則。';
  document.getElementById('resultMsg').textContent = msg;
}
</script>
